# hoer.jetzt - PostgreSQL mit Spock (Multi-Master)
#
#   docker compose -f docker-compose.yml -f docker-compose.spock.yml up -d
#
# Ersetzt den gewoehnlichen postgres-Dienst aus docker-compose.yml durch einen
# mit Spock. Zusammen aufgerufen gewinnt diese Datei - deshalb steht hier nur
# das, was sich unterscheidet.
#
# ---------------------------------------------------------------------------
# Warum ein fertiges Abbild und nicht "Erweiterung nachinstallieren"
#
# Spock ist keine gewoehnliche Erweiterung. Es braucht einen **gepatchten
# PostgreSQL-Quellbaum** - im Spock-Repository liegen dafuer .diff-Dateien je
# Hauptversion, die vor dem Uebersetzen angewandt werden. Ein
# "CREATE EXTENSION spock" auf einem Standard-Postgres schlaegt fehl.
#
# Deshalb das fertige Abbild von pgEdge. Wer es selbst bauen will, braucht
# PostgreSQL aus dem Quelltext samt Patches - machbar, aber dann auch bei
# jedem Sicherheitsupdate wieder.
#
# PRUEFEN, BEVOR DU DICH DARAUF VERLAESST: pgEdge nennt diese Abbilder
# "Enterprise Postgres". Ob sie fuer deinen Fall frei nutzbar sind, steht
# nicht in dieser Datei - das ist eine Lizenzfrage, keine technische.
# Spock selbst steht unter der PostgreSQL-Lizenz.
# ---------------------------------------------------------------------------

services:

  postgres:
    image: ${HJ_PG_IMAGE:-ghcr.io/pgedge/pgedge-postgres:16-spock5-standard}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HJ_DB_NAME:-discordbot}
      POSTGRES_USER: ${HJ_DB_USER:-discordbot}
      POSTGRES_PASSWORD: ${HJ_DB_PASSWORD:?Datenbank-Passwort fehlt}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # Muss hier stehen, seit die Startzeile ueberschrieben wird.
      #
      # PostgreSQL lauscht von Haus aus nur auf localhost. Ohne diese Zeile
      # laeuft der Dienst, der Healthcheck ist gruen - pg_isready geht ueber
      # den lokalen Socket - und trotzdem bekommen der Bot im Nachbarcontainer
      # und die andere Node "Connection refused". Das ist die unangenehmste
      # Sorte Fehler: alles sieht gesund aus, und die Ursache steht nicht dort,
      # wo man sie sucht.
      - -c
      - listen_addresses=*
      # Ohne diese Zeile laeuft alles - ausser der Replikation selbst.
      #
      # PostgreSQL fuehrt eine Positivliste erlaubter Output-Plugins. Spock
      # bringt seines mit (spock_output), steht dort aber nicht drauf. Folge:
      # der Apply-Worker darf den Slot nicht anlegen, startet, scheitert und
      # startet alle fuenf Sekunden neu:
      #
      #   ERROR: library "spock_output" may not be used as an output plugin
      #
      # Von aussen sieht das aus wie "Spock tut nichts": Erweiterung da,
      # Manager laeuft, Abonnement angelegt und aktiviert, Tabellen im
      # Replikationsset - und trotzdem Status "down" und null Slots.
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,spock_output
      # Meldungen nach stdout, nicht in eine Datei im Datenverzeichnis.
      #
      # Das Abbild schaltet den Logging-Collector ein; damit landet alles in
      # PGDATA/log/ und "docker logs" zeigt nur die Zeilen bis zur Umleitung.
      # Der Fehler oben stand stundenlang dort und war ueber den ersten Griff
      # eines jeden Docker-Nutzers nicht zu sehen.
      - -c
      - logging_collector=off
      # Ohne diese sechs laeuft Spock nicht - und der Fehler kommt spaet:
      # das Abbild startet, die Erweiterung laesst sich anlegen, und erst der
      # erste Abgleich scheitert.
      - -c
      - wal_level=logical
      - -c
      - shared_preload_libraries=spock
      - -c
      - track_commit_timestamp=on
      # Je Node ein Slot und ein Sender. 10 laesst Luft fuer acht Nodes.
      - -c
      - max_worker_processes=16
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
    volumes:
      # Der Ablageort des pgEdge-Abbilds, nicht der des offiziellen.
      #
      # Das pgEdge-Abbild legt seine Daten unter /var/lib/pgsql/16/data ab -
      # ein Red-Hat-Pfad - und laeuft dabei *nicht* als root. Das offizielle
      # Abbild startet als root und reicht danach an postgres weiter; deshalb
      # kann es ein frisches Volume uebernehmen, dieses hier nicht:
      #
      #   initdb: error: could not change permissions of directory
      #   "/var/lib/postgresql/data": Operation not permitted
      #
      # Der erste Versuch war, PGDATA auf den Pfad des offiziellen Abbilds zu
      # biegen. Genau daran ist es gescheitert - ein leeres Volume gehoert
      # root, und der Container darf es nicht uebernehmen.
      #
      # Haengt das Volume dagegen an einem Verzeichnis, das im Abbild schon
      # existiert, uebernimmt Docker beim ersten Mal Inhalt *und* Eigentuemer
      # von dort. Deshalb hier der Pfad des Abbilds, statt gegen das Abbild
      # anzukaempfen.
      #
      # Eigener Volumename: derselbe Name an zwei Pfaden waere mehrdeutig -
      # Docker weiss dann nicht, von welchem Verzeichnis aus es befuellen soll.
      - pgdaten-spock:/var/lib/pgsql/16/data
    # Im privaten Hetzner-Netz erreichbar, damit die anderen Nodes anbinden
    # koennen - nach aussen bleibt der Port zu. HJ_PRIVAT_IP ist die 10.x-
    # Adresse dieser Maschine.
    ports:
      - "${HJ_PRIVAT_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      # Mit -h ueber TCP, nicht ueber den lokalen Socket.
      #
      # Ohne -h meldet pg_isready "gesund", sobald der Dienst laeuft - auch
      # wenn er auf keiner Netzwerkadresse lauscht. Genau das war der Fall,
      # als hier listen_addresses fehlte: Container gruen, Bot in der
      # Neustartschleife. Ein Healthcheck, der den Weg des Nutzers nicht geht,
      # prueft die falsche Frage.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${HJ_DB_USER:-discordbot} -d ${HJ_DB_NAME:-discordbot}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [hoerjetzt]

volumes:
  # postgres-daten bleibt deklariert, weil die Basisdatei es fuer denselben
  # Dienst einhaengt und Compose Einhaengepunkte zusammenfuehrt statt sie zu
  # ersetzen. Es bleibt dabei leer - benutzt wird pgdaten-spock.
  postgres-daten:
  pgdaten-spock:

networks:
  hoerjetzt:
    driver: bridge
