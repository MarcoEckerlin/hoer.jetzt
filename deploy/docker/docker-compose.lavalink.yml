# Einzelner Audio-Knoten auf einem eigenen Host.
#
#   HJ_LAVALINK_PASSWORD=... LAVALINK_TIER=premium docker compose \
#       -f docker-compose.lavalink.yml up -d
#
# Der Knoten wird anschliessend im Adminbereich unter Lavalink eingetragen:
# Adresse, Passwort, Stufe und Obergrenze. Erst dieser Eintrag entscheidet,
# welche Server auf ihm landen - die Variable hier dient nur der Anzeige.

name: hoerjetzt-node

# Hier wird nichts mehr gebaut. Die Abbilder kommen fertig vom
# Update-Server; HJ_REGISTRY und die *_TAG-Marken setzt auto-update.sh aus
# dem Release-Manifest in die .env.
#
# Frueher stand an jedem Dienst ein build-Block, der den Quellbaum daneben
# erwartete - deshalb musste auf jeden Knoten der vollstaendige Quellcode.

services:
  lavalink:
    image: ${HJ_REGISTRY:?Registry fehlt - auto-update.sh setzt sie}/lavalink:${LAVALINK_TAG:-latest}
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${HJ_LAVALINK_PASSWORD:?Passwort fehlt}
      LAVALINK_TIER: ${LAVALINK_TIER:-free}
      LAVALINK_PORT: 2333
      YOUTUBE_PLUGIN_VERSION: ${YOUTUBE_PLUGIN_VERSION:-1.18.2}
      YOUTUBE_PLUGIN_SNAPSHOT: ${YOUTUBE_PLUGIN_SNAPSHOT:-false}
      # hoch | mittel | sparsam - siehe entrypoint.sh im lavalink-Zweig.
      LAVALINK_QUALITAET: ${LAVALINK_QUALITAET:-hoch}
      # Altersbeschraenkte Titel gibt YouTube nur an angemeldete Clients.
      # Ohne diese beiden fehlt dem Knoten die YouTube-Anmeldung komplett.
      YOUTUBE_OAUTH: ${YOUTUBE_OAUTH:-false}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YT_CIPHER_URL: ${YT_CIPHER_URL-http://yt-cipher:8001}
      YT_CIPHER_PASSWORD: ${YT_CIPHER_PASSWORD:-}
      YT_CIPHER_USERAGENT: hoerjetzt
    depends_on:
      - yt-cipher
    ports:
      # Nach aussen sichtbar, weil der Bot auf einem anderen Host laeuft.
      # Unbedingt per Firewall auf die Bot-Adresse begrenzen - das Passwort
      # ist der einzige Schutz.
      - "${LAVALINK_BIND:-0.0.0.0}:2333:2333"

  # Entschluesselt YouTubes Stream-Adressen. Ohne ihn haengt das an der
  # Plugin-Version - und die ist Monate alt, waehrend YouTube sein
  # Player-Skript woechentlich tauscht ("must find sig function").
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      PORT: 8001
      API_TOKEN: ${YT_CIPHER_PASSWORD:-}
      OVERRIDE_PLAYER_VARIANT: IAS
