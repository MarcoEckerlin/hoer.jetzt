# hoer.jetzt - Update-Server.
#
# Laeuft zuhause, nicht auf einem Knoten. Drei Aufgaben:
#
#   1. Abbilder ausliefern   -> Forgejo-Registry unter /v2/
#   2. Knoten aufsetzen      -> Pakete und Skripte unter /knoten/
#   3. Zugangsdaten teilen   -> verschluesselter Tresor unter /tresor/
#
# Nach aussen geht nur, was Caddy durchlaesst. Die Forgejo-Oberflaeche und
# das Git bleiben im LAN - ein Knoten braucht beides nicht, und was nicht
# erreichbar ist, kann auch nicht angegriffen werden.

name: hj-update

services:

  # ------------------------------------------------------------------ Front
  #
  # Caddy spricht hier einfaches HTTP. Das Zertifikat haelt der Nginx
  # Proxy Manager, wie fuer alles andere auf diesem Anschluss auch.
  # Der Port gehoert deshalb ins LAN und nicht ins Internet - davor
  # steht der NPM.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Nur im LAN erreichbar. HJ_CADDY_BIND ist die Adresse, unter der
      # der NPM diesen Dienst findet - bei NPM auf demselben Host reicht
      # 127.0.0.1, sonst die LAN-Adresse.
      - "${HJ_CADDY_BIND:-0.0.0.0}:${HJ_PORT_INTERN:-8091}:${HJ_PORT_INTERN:-8091}"
    environment:
      HJ_PORT_INTERN: ${HJ_PORT_INTERN:-8091}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Benanntes Volume, kein Bind-Mount: der CI-Runner startet die Bauschritte
      # in eigenen Containern, und die koennen ein Volume ueber seinen Namen
      # einhaengen. Einen Pfad des Hosts kennen sie nicht.
      #
      # Nur lesend: der Webserver soll nichts veraendern koennen.
      - ausliefern:/srv/ausliefern:ro
      - caddy-daten:/data
      - caddy-konfig:/config
    depends_on:
      - forgejo
      - updater
    networks: [hj-update]

  # ------------------------------------------------------------------ Forgejo
  #
  # Git, CI und OCI-Registry in einem. ROOT_URL muss die oeffentliche Adresse
  # sein: die Registry schickt sie im Www-Authenticate-Kopf mit, und "docker
  # login" folgt genau dieser Angabe. Steht dort eine LAN-Adresse, laeuft die
  # Anmeldung von aussen ins Leere.

  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      # Ohne das haelt sich Forgejo fuer nicht installiert und wartet auf den
      # Web-Installer: es legt keine app.ini an, und jeder Aufruf von
      # "forgejo admin" bricht mit "Unable to load config file for a installed
      # Forgejo instance" ab. Der Health-Check antwortet derweil munter weiter,
      # deshalb faellt es erst beim ersten Verwaltungsbefehl auf.
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: https://${HJ_UPDATE_HOST}/
      FORGEJO__server__DOMAIN: ${HJ_UPDATE_HOST}
      FORGEJO__server__SSH_DOMAIN: ${HJ_GIT_BIND:-127.0.0.1}
      FORGEJO__server__SSH_PORT: 2222
      # Keine offene Registrierung. Den Verwalter legt einrichten.sh an.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Bewusst offen: die Abbilder darf jeder ziehen, der bis hierher kommt -
      # und bis hierher kommt nur, wer Caddy einen gueltigen Ausweis vorgelegt
      # hat. Die Zugangskontrolle steht am Rand, nicht doppelt. Sonst braeuchte
      # ein Knoten zwei Zugangsdaten fuer eine Sache.
      #
      # Die Kehrseite: wer im LAN direkt an Port 3000 kommt, zieht sie ohne
      # alles. Deshalb lauscht Forgejo per Vorgabe nur auf 127.0.0.1.
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__actions__ENABLED: "true"
      # SQLite reicht: ein Benutzer, vier Repositories, ein Build pro Release.
      FORGEJO__database__DB_TYPE: sqlite3
    volumes:
      - forgejo-daten:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Oberflaeche und SSH nur im LAN. Nach aussen reicht Caddy allein /v2/
      # durch - siehe Caddyfile.
      - "${HJ_GIT_BIND:-127.0.0.1}:3000:3000"
      - "${HJ_GIT_BIND:-127.0.0.1}:2222:22"
    networks: [hj-update]

  # ------------------------------------------------------------------ Runner
  #
  # Baut die Abbilder, wenn ein Release getaggt wird. Er bekommt den
  # Docker-Socket des Hosts - anders kann er keine Abbilder bauen. Damit hat
  # er faktisch Wurzelrechte auf diesem Host. Das ist hier vertretbar, weil
  # er nur eigenen Code baut; auf einer Maschine mit fremden Repositories
  # waere es das nicht.

  runner:
    image: code.forgejo.org/forgejo/runner:6
    restart: unless-stopped
    depends_on:
      - forgejo
    volumes:
      - runner-daten:/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /data
    # Angemeldet wird einmalig durch einrichten.sh - dafuer braucht es einen
    # Token, den Forgejo erst im laufenden Betrieb ausstellt. Hier laeuft
    # deshalb nur noch der Dienst.
    command: ["forgejo-runner", "daemon", "--config", "/data/config.yml"]
    networks: [hj-update]


  # ------------------------------------------------------------------ Updater
  #
  # Torwaechter und Verwaltung. Zwei Anschluesse, und der Unterschied zwischen
  # ihnen steht genau hier - nicht in der Anwendung:
  #
  #   8080  Torwaechter. Taucht unten bei "ports" NICHT auf. Damit ist er
  #         ausschliesslich ueber das interne Docker-Netz erreichbar, also
  #         durch Caddy. Kein Login davor, weil die Grenze das Netz ist.
  #
  #   8081  Oberflaeche. Wird auf HJ_PULT_BIND gelegt - Vorgabe 127.0.0.1,
  #         fuer den Zugriff von unterwegs die Tailscale-Adresse dieses Hosts.
  #
  # Waere 8080 hier mit aufgefuehrt, haenge die Zugangskontrolle des gesamten
  # Servers offen im Netz. Das ist der Grund, warum die Trennung an dieser
  # Stelle steht und nicht nur in einer Pfadregel: eine fehlende Zeile faellt
  # beim Lesen auf, eine falsche Pfadregel nicht.

  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      HJ_TOKEN_KNOTEN:    ${HJ_TOKEN_KNOTEN:?Kein Knoten-Passwort - einrichten.sh laufen lassen}
      HJ_TOKEN_AUFSETZEN: ${HJ_TOKEN_AUFSETZEN:?Kein Aufsetz-Passwort - einrichten.sh laufen lassen}
      HJ_VERWALTER_NAME: ${HJ_VERWALTER_NAME:-verwalter}
      HJ_VERWALTER_HASH: ${HJ_VERWALTER_HASH:?Kein Verwalter-Hash - einrichten.sh laufen lassen}
      # Wem die Weiterleitungs-Koepfe geglaubt werden. Siehe application.yml -
      # ohne diese Liste koennte bei offenem Port jeder seine Adresse selbst
      # bestimmen und die Freigabe waere wirkungslos.
      HJ_PROXY_VERTRAUEN: ${HJ_PROXY_VERTRAUEN:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # Der oeffentliche Name - nur fuer die Anzeige: die Knotenseite baut
      # daraus den Aufsetz-Einzeiler.
      HJ_UPDATE_HOST: ${HJ_UPDATE_HOST:?Kein oeffentlicher Name - einrichten.sh laufen lassen}
      HJ_PROTOKOLL_TAGE: ${HJ_PROTOKOLL_TAGE:-21}
      HJ_DATEN: /daten
      # Wo die Tresor-Klartexte liegen. Der Updater liest sie und richtet sie
      # beim Abruf an den anfragenden Knoten - siehe Tresorausgabe.
      HJ_AUSLIEFERN: /srv/ausliefern
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - updater-daten:/daten
      # Nur lesend. Der Updater soll den Tresor verschluesseln koennen, aber
      # nichts im Auslieferungsverzeichnis veraendern - das befuellen
      # ausschliesslich veroeffentlichen.sh und tresor.sh.
      - ausliefern:/srv/ausliefern:ro
    ports:
      - "${HJ_PULT_BIND:-0.0.0.0}:${HJ_PULT_PORT:-8090}:8081"
    networks: [hj-update]

volumes:
  # Alles, was ausgeliefert wird: Release-Manifest, Knotenpakete, Tresor.
  # Geschrieben von veroeffentlichen.sh und tresor.sh, gelesen von Caddy.
  ausliefern:
  caddy-daten:
  caddy-konfig:
  forgejo-daten:
  runner-daten:
  # Freigaben, Knotenmeldungen und Zugriffsprotokoll. Klein, aber der
  # Verlust hiesse: alle Knoten ausgesperrt, bis von Hand neu freigeschaltet.
  updater-daten:

networks:
  hj-update:
    driver: bridge
