<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head th:replace="~{grund :: kopf('Knoten verwalten')}"></head>
<body>
<nav th:replace="~{grund :: navigation('verwalten')}"></nav>
<main>
    <div th:replace="~{grund :: meldungen}"></div>

    <!--
      Der Token wird genau einmal gezeigt. Gespeichert ist nur sein Hash -
      wer ihn hier verpasst, erzeugt einen neuen. Deshalb steht er gross und
      oben und nicht als Zeile in der Tabelle.
    -->
    <div class="einmalig" th:if="${neuerToken}">
        <h2>Aufsetz-Token fuer <span th:text="${neueKennung}"></span></h2>
        <p class="gross" th:text="${neuerToken}"></p>
        <p>
            Gilt zwei Stunden und genau einmal. <strong>Wird nicht noch einmal
            angezeigt</strong> &ndash; hier steht nur der Hash in der Datenbank.
        </p>

        <!--
          Ein Befehl, ein Geheimnis, nichts vorher herunterladen.
          Der Token oeffnet sowohl den Download unter /knoten/ als auch die
          Anmeldung - deshalb genuegt er allein.

          Der Befehl wird im Controller zusammengesetzt, nicht hier. Der
          erste Versuch baute ihn in diesem th:text - und scheiterte am
          senkrechten Strich in "| bash -s --": Thymeleaf deutet | als Beginn
          einer Literalersetzung, mitten im Ausdruck. Ergebnis war ein 500er
          auf der ganzen Seite, nicht nur an dieser Zeile.

          In Java ist es ohnehin der bessere Ort: dort laesst es sich pruefen.
        -->
        <p class="klein">Auf dem neuen Rechner als root ausfuehren:</p>
        <pre class="befehl" th:text="${aufsetzBefehl}"></pre>
