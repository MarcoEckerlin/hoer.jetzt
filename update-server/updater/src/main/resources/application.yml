# hoer.jetzt - Update-Server, Verwaltungsteil.

server:
  # Der Torwaechter. Wird im Compose-Verbund nicht auf den Host gelegt.
  port: 8080
  # Tomcat soll den echten Pfad der urspruenglichen Anfrage nicht selbst
  # aus den X-Forwarded-Koepfen ableiten - die Auswertung steht im
  # TorController, und zwar bewusst anders als die Vorgabe (letzter statt
  # erster Eintrag). Zwei Auswertungen derselben Koepfe waeren eine zu viel.
  forward-headers-strategy: none

hj:
  # Der oeffentliche Name dieses Servers.
  #
  # Nur fuer die Anzeige: die Knotenseite baut daraus den Aufsetz-Einzeiler.
  # Ohne ihn stuende dort ein Platzhalter, und wer ihn kopiert, bekaeme einen
  # Befehl, der nirgendwohin zeigt.
  update-host: ${HJ_UPDATE_HOST:repository.hoer.jetzt}

  # Wessen Weiterleitungs-Koepfen geglaubt wird.
  #
  # Die echte Adresse eines Aufrufers steht hinter einem Proxy nicht in der
  # Verbindung, sondern in CF-Connecting-IP oder X-Forwarded-For. Das sind
  # gewoehnliche Kopfzeilen - jeder kann sie schicken.
  #
  # Sie zaehlen deshalb nur, wenn die Gegenstelle der Verbindung selbst hier
  # aufgefuehrt ist. Wer direkt anklopft, wird mit seiner echten Adresse
  # gemessen, und was er in die Koepfe geschrieben hat, faellt weg.
  #
  # Das ist die Voraussetzung dafuer, dass der Port offen im Netz stehen darf:
  # ohne diese Pruefung genuegte ein Header, um sich an der Adressfreigabe
  # vorbeizuhangeln - und im Protokoll stuende die erfundene Adresse.
  #
  # Die Vorgabe deckt localhost und die privaten Bereiche ab, also Caddy und
  # NPM im Docker-Netz. Steht der NPM auf einem anderen Host im LAN, ist er
  # damit ebenfalls erfasst.
  proxy:
    vertrauen: ${HJ_PROXY_VERTRAUEN:127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}

  # Die Oberflaeche. Liegt im privaten Netz.
  pult-port: 8081
  # Die beiden Knoten-Passwoerter. Im Klartext, weil sie im Klartext
  # verglichen werden - ein Hash brauchte hier niemanden zu schuetzen:
  # wer diese Datei lesen kann, steht ohnehin auf dem Server.
  token:
    knoten:    ${HJ_TOKEN_KNOTEN:?Kein Knoten-Passwort - einrichten.sh laufen lassen}
    aufsetzen: ${HJ_TOKEN_AUFSETZEN:?Kein Aufsetz-Passwort - einrichten.sh laufen lassen}
    # Das Passwort, mit dem der Update-Server in seine EIGENE Registry
    # schiebt. Er ist kein Knoten - keine Kennung, keine Module -, braucht
    # aber Zugang zu /v2/. Steht nur in der .env dieses Servers und wird
    # nirgends ausgeliefert.
    veroeffentlichen: ${HJ_TOKEN_VEROEFFENTLICHEN:}
    # Das gemeinsame Passwort: aus.
    #
    # Es war als Uebergang gedacht, damit bestehende Knoten beim ersten Start
    # dieser Fassung nicht stehenbleiben. Der Uebergang entfaellt - alle
    # Knoten werden neu aufgesetzt und bekommen dabei eine eigene Kennung.
    #
    # Aus heisst: ein Knoten OHNE eigenes Geheimnis kommt nirgends mehr durch.
    # Das ist die schaerfere und richtige Vorgabe. Wer sie voruebergehend
    # braucht - etwa weil ein Knoten mitten im Umbau haengt - setzt
    # HJ_GEMEINSAM_ERLAUBEN=true, und zwar ausdruecklich und nachweisbar
    # statt versehentlich.
    gemeinsam-erlauben: ${HJ_GEMEINSAM_ERLAUBEN:false}
  verwalter:
    name: ${HJ_VERWALTER_NAME:verwalter}
    hash: ${HJ_VERWALTER_HASH:?Kein Verwalter-Hash - einrichten.sh laufen lassen}
  # Wie lange das Zugriffsprotokoll aufbewahrt wird.
  protokoll-tage: ${HJ_PROTOKOLL_TAGE:21}
  # Wo das Auslieferungsverzeichnis eingehaengt ist. Der Updater liest daraus
  # die Tresor-Klartexte und richtet sie beim Abruf an den fragenden Knoten -
  # deshalb braucht er es, obwohl Caddy die uebrigen Dateien ausliefert.
  ausliefern: ${HJ_AUSLIEFERN:/srv/ausliefern}
  daten: ${HJ_DATEN:/daten}
  # Sicherungen der beiden Controller und die eigene.
  #
  # Im Datenverzeichnis und NICHT im Auslieferungsverzeichnis: was dort liegt,
  # gibt Caddy per file_server heraus. Ein Datenbankabzug mit allen Bot-Token
  # gehoert nicht in einen Pfad, dessen Aufgabe das Ausliefern ist.
  sicherungen: ${HJ_SICHERUNGEN:/daten/sicherungen}

spring:
  application:
    name: hj-updater
  datasource:
    url: jdbc:sqlite:${HJ_DATEN:/daten}/updater.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite vertraegt genau einen Schreiber. Ein Pool mit mehreren
      # Verbindungen brauchte dafuer eine Wiederholung auf SQLITE_BUSY -
      # bei dieser Last waere das Aufwand fuer nichts: der Torwaechter
      # beantwortet das meiste aus seinem Zwischenspeicher, und was hier
      # ankommt, sind einzelne Abfragen.
      maximum-pool-size: 1
      # Ohne WAL sperrt ein Schreibvorgang die gesamte Datei, auch fuer
      # Leser. Mit WAL laufen Lesen und Schreiben nebeneinander.
      connection-init-sql: PRAGMA journal_mode=WAL
  sql:
    init:
      # schema.sql ist durchgehend "IF NOT EXISTS" - der Lauf bei jedem Start
      # ist damit folgenlos und spart eine Wanderungsmechanik, die es fuer
      # drei Tabellen nicht braucht.
      mode: always
  thymeleaf:
    cache: true

logging:
  level:
    root: INFO
    jetzt.hoer.updater: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{0} - %msg%n"
