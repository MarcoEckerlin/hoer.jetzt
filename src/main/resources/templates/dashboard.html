<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Serverpanel — ${botBrand.displayName}|">Serverpanel</title>
    <link rel="stylesheet" href="/panel.css">

    <!-- Ohne defer und vor dem Rendern: sonst blitzt die helle Fassung auf. -->

    <script src="/theme.js" th:src="@{/theme.js(v=${assetVersion})}"></script>
</head>
<body>
<script src="/panel-icons.js"></script>

<div class="app">

    <!-- ===================== Serverleiste ===================== -->
    <nav class="rail" id="guildRail" aria-label="Server"></nav>

    <!-- ===================== Navigation ===================== -->
    <div class="nav">
        <div class="nav-head">
            <span class="dot" id="guildDot"></span>
            <span id="guildName">Server wählen</span>
        </div>
        <div class="nav-search">
            <input id="navSearch" type="search" placeholder="Einstellung suchen…" autocomplete="off">
        </div>
        <div class="nav-scroll" id="navScroll">

            <div class="nav-group">
                <h3>Server</h3>
                <button class="nav-link is-active" data-page="overview">
                    <svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Übersicht</button>
                <button class="nav-link" data-page="permissions">
                    <svg viewBox="0 0 24 24"><use href="#i-shield"/></svg>Rollenrechte</button>
            </div>

            <div class="nav-group">
                <h3>Musik</h3>
                <button class="nav-link" data-page="player">
                    <svg viewBox="0 0 24 24"><use href="#i-music"/></svg>Player<span class="badge" id="playerBadge"></span></button>
                <button class="nav-link" data-page="queue">
                    <svg viewBox="0 0 24 24"><use href="#i-queue"/></svg>Warteschlange<span class="badge" id="queueBadge"></span></button>
                <button class="nav-link" data-page="radio">
                    <svg viewBox="0 0 24 24"><use href="#i-radio"/></svg>Webradio</button>
            </div>

            <div class="nav-group">
                <h3>Community</h3>
                <button class="nav-link" data-page="welcome">
                    <svg viewBox="0 0 24 24"><use href="#i-welcome"/></svg>Willkommen<span class="badge" data-mod="welcome"></span></button>
                <button class="nav-link" data-page="verify">
                    <svg viewBox="0 0 24 24"><use href="#i-verify"/></svg>Verifizierung<span class="badge" data-mod="verify"></span></button>
                <button class="nav-link" data-page="reactionroles">
                    <svg viewBox="0 0 24 24"><use href="#i-roles"/></svg>Reaction-Roles<span class="badge" data-mod="reactionRoles"></span></button>
                <button class="nav-link" data-page="invites">
                    <svg viewBox="0 0 24 24"><use href="#i-invite"/></svg>Invite-Tracking<span class="badge" data-mod="inviteTracker"></span></button>
                <button class="nav-link" data-page="invitelink">
                    <svg viewBox="0 0 24 24"><use href="#i-link"/></svg>Einladungslink</button>
                <button class="nav-link" data-page="vorlagen">
                    <svg viewBox="0 0 24 24"><use href="#i-brand"/></svg>Nachrichten-Vorlagen</button>
            </div>

            <div class="nav-group">
                <h3>Moderation</h3>
                <button class="nav-link" data-page="tickets">
                    <svg viewBox="0 0 24 24"><use href="#i-ticket"/></svg>Tickets<span class="badge" data-mod="tickets"></span></button>
                <button class="nav-link" data-page="logs">
                    <svg viewBox="0 0 24 24"><use href="#i-logs"/></svg>Discord-Logs<span class="badge" data-mod="discordLogs"></span></button>
            </div>

            <div class="nav-group">
                <h3>Sprachkanäle</h3>
                <button class="nav-link" data-page="jtc">
                    <svg viewBox="0 0 24 24"><use href="#i-voice"/></svg>Join-to-Create<span class="badge" data-mod="joinToCreate"></span></button>
            </div>

            <div class="nav-group">
                <h3>Assistent</h3>
                <button class="nav-link" data-page="llm">
                    <svg viewBox="0 0 24 24"><use href="#i-ai"/></svg>KI-Chat<span class="badge" data-mod="llm"></span></button>
            </div>

            <div class="nav-group">
                <h3>Bot</h3>
                <button class="nav-link" data-page="commands">
                    <svg viewBox="0 0 24 24"><use href="#i-cmd"/></svg>Commands<span class="badge" id="commandBadge"></span></button>
            </div>

        </div>
        <div class="nav-foot">
            <div class="avatar">
                <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="">
                <span th:unless="${user.avatarUrl}" th:text="${#strings.substring(user.username,0,1)}">M</span>
            </div>
            <div class="who">
                <b th:text="${user.username}">Nutzer</b>
                <span id="ownRole">angemeldet</span>
            </div>
        </div>
    </div>

    <!-- ===================== Inhalt ===================== -->
    <main class="main">
        <div class="topbar">
            <button class="burger" id="burger" aria-label="Navigation">
                <svg viewBox="0 0 24 24" width="22" height="22"><use href="#i-menu"/></svg>
            </button>
            <div class="crumb">
                <svg viewBox="0 0 24 24" id="crumbIcon"><use href="#i-home"/></svg>
                <b id="crumbText">Übersicht</b>
            </div>
            <div class="spacer"></div>
            <span class="status-pill opt" id="voicePill" hidden></span>
            <span class="status-pill" id="connPill"><span class="dot"></span>getrennt</span>
            <a th:if="${adminAllowed}" class="icon-btn" href="/admin" title="Bot-Verwaltung">
                <svg viewBox="0 0 24 24"><use href="#i-settings"/></svg>
            </a>
            <a class="icon-btn" href="/logout" title="Abmelden">
                <svg viewBox="0 0 24 24"><use href="#i-exit"/></svg>
            </a>
        </div>

        <div class="scroll" id="scroll">
            <div class="page" id="page">
                <div class="empty"><span class="spinner"></span></div>
            </div>
        </div>

        <div class="savebar" id="savebar" role="status">
            <span class="msg">Vorsicht — du hast ungespeicherte Änderungen!</span>
            <button class="btn btn-ghost btn-sm" id="resetBtn">Zurücksetzen</button>
            <button class="btn btn-success btn-sm" id="saveBtn">Änderungen speichern</button>
        </div>
    </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script th:inline="javascript">
    window.PANEL_BOOT = {
        guilds: /*[[${guilds}]]*/ [],
        adminAllowed: /*[[${adminAllowed}]]*/ false
    };
</script>
<script src="/panel-upload.js"></script>
<script src="/dashboard-panel.js"></script>
</html>
