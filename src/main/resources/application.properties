# Der Port wird in Main.java aus der config.json gesetzt und ueberschreibt
# diesen Wert. Er dient nur als Fallback.
server.port=8080

# --- Asynchrone Requests --------------------------------------------------
# Die Player-Endpunkte geben CompletableFuture zurueck. Ohne explizites Limit
# gilt der Container-Standard: der Browser haengt bis zu 30 Sekunden an einer
# einzigen Anfrage, wenn Lavalink nicht antwortet. Genau das fuehlt sich im
# Dashboard wie ein Abbruch an. 12 Sekunden decken jede normale Ladezeit ab.
spring.mvc.async.request-timeout=12000

# --- Statische Auslieferung ----------------------------------------------
# Ohne Caching laedt jeder Dashboard-Refresh CSS und JS komplett neu. Fuenf
# Minuten sind lang genug fuer fluessiges Navigieren und kurz genug, dass ein
# Deploy nicht durch veraltete Dateien im Browser-Cache blockiert wird. Die
# Templates haengen zusaetzlich einen Versionsparameter an.
spring.web.resources.cache.cachecontrol.max-age=300
spring.web.resources.cache.cachecontrol.cache-public=true

# Antwortkompression spart bei dashboard.js und dashboard.css den Grossteil
# der Uebertragungszeit.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# --- Thymeleaf -----------------------------------------------------------
spring.thymeleaf.cache=true

# --- Fehlerdarstellung ---------------------------------------------------
# Fehlermeldungen sollen im JSON-Body landen, damit das Dashboard sie anzeigen
# kann, statt eine HTML-Fehlerseite in den Statusbalken zu schreiben.
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Tomcat --------------------------------------------------------------
server.tomcat.threads.max=80
server.tomcat.connection-timeout=10000

logging.level.org.springframework.web=WARN
