# hoer.jetzt - Update-Server pruefen.
#
# Laeuft bei jedem Push, der den Update-Server oder die Deploy-Skripte
# beruehrt. Er baut und veroeffentlicht NICHTS - das macht weiterhin der
# Runner auf dem Update-Server selbst (.forgejo/workflows/release.yml), weil
# nur der an die Registry kommt.
#
# ---------------------------------------------------------------------------
# Wozu dann diese Pipeline
#
# Weil install-update-server.sh seinen Stand von GitHub holt. Was hier im
# Zweig main liegt, laeuft auf dem naechsten frisch aufgesetzten Server -
# ohne Zwischenstufe und ohne dass jemand vorher baut. Ein Uebersetzungsfehler
# faellt damit erst beim Aufsetzen auf, und dort steht niemand daneben.
#
# Geprueft wird deshalb genau das, was diese Kette braucht: uebersetzt der
# Updater, laufen seine Proben, und sind die Skripte syntaktisch heil.
# ---------------------------------------------------------------------------

name: Update-Server

on:
  push:
    branches: [main]
    paths:
      - "update-server/**"
      - "deploy/**"
      - ".github/workflows/update-server.yml"
  pull_request:
    paths:
      - "update-server/**"
      - "deploy/**"
  # Von Hand ausloesbar - fuer den Fall, dass man vor einem Aufsetzen
  # nachsehen will, ob der Zweig gerade heil ist.
  workflow_dispatch:

jobs:
  updater:
    name: Updater uebersetzen und pruefen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # "verify" und nicht "package": es soll die Proben mitnehmen. Darunter
      # sind die beiden, an denen die Zugangstrennung haengt - PfadrechteTest
      # und UmschlagTest. Ein gruener Build ohne sie waere hier wertlos.
      - name: Bauen und pruefen
        working-directory: update-server/updater
        run: mvn -B --no-transfer-progress verify

      - name: Probenergebnis sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probenergebnisse
          path: update-server/updater/target/surefire-reports/
          if-no-files-found: ignore

  skripte:
    name: Skripte pruefen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Syntax zuerst. Ein Skript mit einem Klammerfehler bricht auf dem
      # Zielsystem irgendwo in der Mitte ab - also nachdem es schon etwas
      # angefasst hat.
      - name: Syntax
        run: |
          set -euo pipefail
          fehler=0
          while read -r f; do
              if bash -n "$f"; then
                  printf 'ok   %s\n' "$f"
              else
                  printf 'FEHL %s\n' "$f"
                  fehler=1
              fi
          done < <(find deploy update-server -name "*.sh" | sort)
          exit "$fehler"

      # CRLF hat hier schon einmal Lavalink in eine Neustartschleife geschickt:
      # ein "#!/usr/bin/env bash" mit angehaengtem Wagenruecklauf endet in
      # "set: Illegal option -". .gitattributes verhindert es beim Auschecken,
      # aber eine Datei, die mit CRLF eingecheckt wurde, bleibt kaputt.
      - name: Keine CRLF-Zeilenenden
        run: |
          set -euo pipefail
          if betroffen="$(find deploy update-server -name '*.sh' -exec file {} + | grep -i crlf)"; then
              echo "Diese Skripte haben CRLF-Zeilenenden:"
              echo "$betroffen"
              echo
              echo "Beheben mit: sed -i 's/\\r\$//' <datei>"
              exit 1
          fi
          echo "Keine CRLF-Zeilenenden."


      # Der Weg aus der Anleitung ist "curl ... | bash". Dabei kommt das
      # Skript von der Standardeingabe und hat keinen Dateinamen -
      # ${BASH_SOURCE[0]} ist leer, und mit "set -u" bricht es mit
      # "unbound variable" ab.
      #
      # Genau das ist passiert, und zwar nur auf diesem Weg: aus einer Datei
      # heraus lief dasselbe Skript fehlerfrei. Eine reine Syntaxpruefung
      # findet es nicht, weil die Zeile syntaktisch tadellos ist.
      #
      # Also wirklich durch die Pipe schicken. Ohne root laufen sie nur bis
      # zur Rechtepruefung - das genuegt, denn der Fehler lag davor.
      - name: Laufen die Installer durch eine Pipe?
        run: |
          set -uo pipefail
          fehler=0
          for s in deploy/install-update-server.sh update-server/neu-aufsetzen.sh deploy/bootstrap.sh; do
              ausgabe="$(cat "$s" | bash 2>&1 || true)"
              if echo "$ausgabe" | grep -q "unbound variable"; then
                  printf 'FEHL %s\n' "$s"
                  echo "$ausgabe" | head -3 | sed 's/^/       /'
                  fehler=1
              else
                  printf 'ok   %s\n' "$s"
              fi
          done
          # install-node.sh laedt Nachbardateien und kann nicht durch eine
          # Pipe laufen - es muss das aber SAGEN statt abzustuerzen.
          ausgabe="$(cat deploy/install-node.sh | bash 2>&1 || true)"
          if echo "$ausgabe" | grep -q "unbound variable"; then
              echo "FEHL deploy/install-node.sh - bricht ab statt zu erklaeren"
              fehler=1
          else
              echo "ok   deploy/install-node.sh (erklaert sich)"
          fi
          exit "$fehler"


      # Faengt jedes ausfuehrbare Skript mit einer Shebang an?
      #
      # Anlass: in veroeffentlichen.sh standen die ersten beiden Zeilen einer
      # docker-build-Zeile ganz oben, und die Shebang war weg. bash fuehrte
      # die Datei trotzdem aus - es meldete nur
      #
      #   veroeffentlichen.sh: line 1: -t: command not found
      #
      # und lief weiter. Der Schaden lag Wochen unbemerkt im Zweig, weil eine
      # Syntaxpruefung ihn nicht sieht: die Datei IST syntaktisch gueltig, sie
      # beginnt nur mit Unsinn.
      #
      # lib.sh ist ausgenommen: die Datei wird eingebunden und nicht
      # ausgefuehrt, dort gehoert keine Shebang hin.
      - name: Shebang und kein Vorspann
        run: |
          set -uo pipefail
          fehler=0
          while read -r f; do
              case "$f" in */lib.sh|*/agent-lib.sh) continue ;; esac
              erste="$(head -1 "$f")"
              if [ "$erste" = "#!/usr/bin/env bash" ]; then
                  printf 'ok   %s\n' "$f"
              else
                  printf 'FEHL %-42s erste Zeile: %s\n' "$f" "$erste"
                  fehler=1
              fi
          done < <(find deploy update-server -name "*.sh" | sort)
          exit "$fehler"


      # Gibt es jede Tabelle, die der Java-Code anspricht?
      #
      # Anlass: AusweisDaten loeschte aus "knoten_ausweis" - eine Tabelle, die
      # es nie gab. Das Geheimnis liegt als Spalte in "knoten". Die Anweisung
      # warf, der Aufruf endete mit 500, und in der Oberflaeche sah es aus,
      # als tue der Loeschknopf schlicht nichts: keine Meldung, und nach dem
      # Neuladen stand der Knoten wieder da.
      #
      # Der Uebersetzer sieht so etwas nicht - SQL ist fuer ihn eine
      # Zeichenkette. Und in den Proben kommt es nicht vor, weil die
      # Datenbankschicht dort nicht laeuft.
      - name: Sprechen die Abfragen vorhandene Tabellen an?
        run: |
          set -uo pipefail
          schema=update-server/updater/src/main/resources/schema.sql
          vorhanden="$(grep -ioE 'CREATE TABLE (IF NOT EXISTS )?[a-z_]+' "$schema" \
                       | awk '{print $NF}' | sort -u)"
          fehler=0
          benutzt="$(grep -rhoE '(FROM|INTO|UPDATE|DELETE FROM|JOIN) +[a-z_]+' \
                     update-server/updater/src/main/java --include='*.java' \
                     | awk '{print $NF}' | sort -u)"
          for t in $benutzt; do
              # SQL-Schluesselwoerter und Unterabfragen aussortieren.
              case "$t" in select|values|set|where|dual|"") continue ;; esac
              if echo "$vorhanden" | grep -qx "$t"; then
                  printf 'ok   %s\n' "$t"
              else
                  printf 'FEHL %s wird angesprochen, steht aber nicht im Schema\n' "$t"
                  fehler=1
              fi
          done
          exit "$fehler"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Nur Fehler, keine Stilhinweise: die Skripte sind gewachsen, und
          # eine Pipeline, die an einem Hinweis scheitert, wird abgeschaltet
          # statt beachtet.
          find deploy update-server -name "*.sh" -print0 \
            | xargs -0 shellcheck -S error --external-sources || exit 1


      # Caddy prueft seine eigene Konfiguration - "bash -n" kann das nicht.
      #
      # Anlass: der Baustein (zugang) stand im Site-Block statt auf oberster
      # Ebene. Caddy kennt Snippets nur ausserhalb einer Site, hielt
      # "import zugang" also fuer einen Dateinamen und startete gar nicht:
      #
      #   File to import not found: zugang, at /etc/caddy/Caddyfile:88
      #
      # Der Container lief in einer Neustartschleife, nichts lauschte auf dem
      # Port, und der Proxy davor meldete 502. Gesucht wurde daraufhin an der
      # Weiterleitung - die Ursache war eine Einrueckungsebene in dieser Datei.
      #
      # Die Umgebungswerte sind nur Platzhalter, damit die Pruefung durchlaeuft.
      - name: Caddyfile validieren
        run: |
          set -euo pipefail
          docker run --rm \
            -e HJ_PORT_INTERN=8091 \
            -v "${PWD}/update-server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
          echo "Caddyfile ok."

      # Holt bootstrap.sh das, was veroeffentlichen.sh ablegt?
      #
      # Diese beiden Enden sind unabhaengig gewachsen und liefen auseinander:
      # bootstrap.sh laedt "knoten/<zweig>.tar.gz", veroeffentlichen.sh legte
      # aber nur "knoten/voll.tar.gz" und "knoten/lavalink.tar.gz" ab - Namen
      # aus der Zeit vor den modularen Installern. install-node.sh und die
      # Einzelinstaller kamen damit ueberhaupt nie auf einen Knoten.
      #
      # Gemerkt haette man es erst beim ersten Aufsetzen ueber diesen Weg.
      - name: Passen Bootstrap und Veroeffentlichung zusammen?
        run: |
          set -euo pipefail
          fehler=0
          holt="$(grep -oE 'knoten/\$\{ZWEIG\}\.tar\.gz' deploy/bootstrap.sh | head -1 || true)"
          if [ -z "$holt" ]; then
              echo "bootstrap.sh laedt nicht mehr knoten/\${ZWEIG}.tar.gz - Pruefung anpassen."
              fehler=1
          fi
          if ! grep -q 'knoten/\${ZWEIG_NAME}\.tar\.gz' update-server/veroeffentlichen.sh; then
              echo "FEHL veroeffentlichen.sh legt kein knoten/<zweig>.tar.gz ab"
              echo "     bootstrap.sh wuerde beim Herunterladen scheitern."
              fehler=1
          else
              echo "ok   Bundle wird veroeffentlicht"
          fi
          # Und enthaelt es, was bootstrap.sh danach startet?
          for s in install-node.sh install-controller.sh install-core.sh \
                   install-lavalink.sh install-ki-radio.sh \
                   agent/agent-lib.sh agent/tresor-oeffnen.sh auto-update.sh; do
              if [ -f "deploy/$s" ]; then
                  echo "ok   deploy/$s"
              else
                  echo "FEHL deploy/$s fehlt"
                  fehler=1
              fi
          done
          exit "$fehler"



      # Katalog gegen Tresor und Compose.
      #
      # Drei Fehler, die der Uebersetzer nicht sehen kann, weil es fuer ihn
      # Zeichenketten sind:
      #
      #   1. Ein Schluessel steht im Katalog UND im Tresor. Dann gibt es zwei
      #      Quellen fuer denselben Wert, und man merkt es an dem Tag, an dem
      #      sie auseinanderlaufen.
      #   2. Ein Schluessel im Katalog, den keine Compose-Datei liest. Ein
      #      Tippfehler wie LAVALINK_QUALITAT wird stillschweigend ignoriert:
      #      der Knoten nimmt seinen Vorgabewert, alles laeuft, nur eben
      #      anders als gedacht.
      #   3. Die Sperrliste im Knoten (auto-update.sh) faellt hinter die des
      #      Servers zurueck. Sie ist die zweite Schicht - wenn sie nicht
      #      mindestens die Geheimnisse kennt, ist sie keine.
      - name: Voreinstellungen bleiben in ihrer Spur
        run: |
          set -uo pipefail
          fehler=0
          KAT=update-server/updater/src/main/java/jetzt/hoer/updater/dienst/Einstellungskatalog.java

          # Die Schluessel des Katalogs: erstes Argument der Eintrags-Bauer.
          grep -oE '^\s+(text|schalter|zahl|auswahl)\("[A-Z][A-Z0-9_]*"' "$KAT" \
              | grep -oE '"[A-Z][A-Z0-9_]*"' | tr -d '"' | sort -u > /tmp/katalog.txt
          echo "Katalog: $(wc -l < /tmp/katalog.txt) Schluessel"
          [ -s /tmp/katalog.txt ] || { echo "FEHL keine Schluessel gefunden - Pruefung anpassen."; exit 1; }

          # 1) Ueberschneidung mit dem Tresor
          grep -oE '^[A-Z][A-Z0-9_]*=\$\{[A-Z_]+\}' update-server/tresor.sh \
              | cut -d= -f1 | sort -u > /tmp/tresor.txt
          echo "Tresor:  $(wc -l < /tmp/tresor.txt) Schluessel"
          if doppelt="$(comm -12 /tmp/katalog.txt /tmp/tresor.txt)" && [ -n "$doppelt" ]; then
              echo "FEHL diese Schluessel liefert der Tresor schon:"
              echo "$doppelt" | sed 's/^/     /'
              fehler=1
          else
              echo "ok   keine Ueberschneidung mit dem Tresor"
          fi

          # 2) Liest ueberhaupt jemand diese Schluessel?
          grep -ohE '\$\{[A-Z][A-Z0-9_]*[:?-]' deploy/docker/*.yml \
              | sed 's/\${//;s/[:?-]$//' | sort -u > /tmp/compose.txt
          while read -r s; do
              if grep -qx "$s" /tmp/compose.txt; then
                  printf 'ok   %s\n' "$s"
              else
                  printf 'FEHL %s liest keine Compose-Datei - Tippfehler?\n' "$s"
                  fehler=1
              fi
          done < /tmp/katalog.txt

          # 3) Die Sperrliste im Knoten
          for s in HJ_BOT_TOKEN HJ_DB_PASSWORD HJ_LAVALINK_PASSWORD \
                   HJ_DISCORD_CLIENT_SECRET HJ_SHARD_VON HJ_SHARD_BIS \
                   HJ_REGISTRY HJ_GEHEIMNIS_SCHLUESSEL; do
              if grep -q "\b${s}\b" deploy/auto-update.sh; then
                  printf 'ok   Knoten sperrt %s\n' "$s"
              else
                  printf 'FEHL auto-update.sh sperrt %s nicht\n' "$s"
                  echo "     Die zweite Schicht ist nur eine, wenn sie das Wichtigste kennt."
                  fehler=1
              fi
          done
          exit "$fehler"


      # Ist ein frisch aufgesetzter Knoten ueberhaupt erreichbar?
      #
      # Die bestehende Pruefung "Wird jeder Pflichtwert gesetzt?" sieht nur
      # Variablen mit ":?" - die brechen den Start ab, wenn sie fehlen. Genau
      # deshalb hat sie HJ_WEB_BIND nie beanstandet: der hat einen
      # Vorgabewert, und der lautet 127.0.0.1.
      #
      # install-node.sh setzte ihn nicht. Ein ueber bootstrap aufgesetzter
      # Knoten lauschte damit nur auf sich selbst - die Weboberflaeche war
      # weder ueber die IP noch ueber den Loadbalancer zu erreichen. Der
      # Container lief, das Log war leer, docker ps sagte "Up".
      #
      # Ein Vorgabewert, der den Dienst unbrauchbar macht, ist gefaehrlicher
      # als ein fehlender Wert: fehlt er, bricht es ab und man sucht sofort.
      - name: Ist ein neuer Knoten erreichbar?
        run: |
          set -uo pipefail
          fehler=0

          # Welche Ports veroeffentlicht die Knoten-Compose, und mit welchem
          # Vorgabewert als Adresse?
          while read -r zeile; do
              adresse="$(printf '%s' "$zeile" | grep -oE '\$\{[A-Z_]+:-[^}]*\}' | head -1 \
                         | sed 's/.*:-//;s/}//')"
              schluessel="$(printf '%s' "$zeile" | grep -oE '\$\{[A-Z_]+:-' | head -1 \
                            | sed 's/\${//;s/:-//')"
              [ -n "$schluessel" ] || continue
              case "$adresse" in
                  127.0.0.1|localhost|::1)
                      if grep -q "umgebung_setzen ${schluessel}" deploy/install-node.sh; then
                          printf 'ok   %-20s Vorgabe %s, aber install-node.sh setzt ihn\n' \
                                 "$schluessel" "$adresse"
                      else
                          printf 'FEHL %-20s Vorgabe %s und niemand setzt ihn\n' \
                                 "$schluessel" "$adresse"
                          echo "     Der Dienst laeuft dann, ist aber von aussen tot."
                          fehler=1
                      fi
                      ;;
                  *)
                      printf 'ok   %-20s Vorgabe %s\n' "$schluessel" "$adresse"
                      ;;
              esac
          done < <(grep -E '^\s+- "\$\{[A-Z_]+:-' deploy/docker/docker-compose.yml)

          # Und kommt die .env dort an, wo Compose sie liest?
          #
          # Es gibt zwei: ${ARBEIT}/.env schreibt der Installer,
          # ${ARBEIT}/main/deploy/docker/.env liest Compose. Wer nur die
          # erste fuellt und dann "compose up" ruft, aendert nichts - und
          # sieht eine korrekte .env neben einem Container, der sie nicht
          # kennt.
          u="$(grep -n 'umgebung_uebertragen' deploy/install-node.sh | grep -v '^.*#' | head -1 | cut -d: -f1)"
          c="$(grep -n 'compose up -d' deploy/install-node.sh | head -1 | cut -d: -f1)"
          if [ -z "$u" ]; then
              echo "FEHL install-node.sh uebertraegt die .env nicht ins Compose-Verzeichnis"
              fehler=1
          elif [ "$u" -ge "$c" ]; then
              echo "FEHL install-node.sh uebertraegt die .env erst NACH 'compose up'"
              echo "     (Zeile $u nach Zeile $c) - beim Start gilt dann noch der alte Stand."
              fehler=1
          else
              echo "ok   .env wird vor 'compose up' uebertragen (Zeile $u vor $c)"
          fi

          # Zieht der Knoten nur seine eigenen Abbilder?
          #
          # "docker compose pull" ohne Dienstnamen zieht ALLES aus der Datei.
          # Auf einem Controller heisst das auch lavalink - und dafuer hat er
          # keine Faehigkeit:
          #
          #   failed to fetch oauth token: ... hoerjetzt/lavalink:pull
          #   403 Forbidden
          #
          # Die Registry tut damit, was sie soll. Falsch war die Frage. Der
          # ganze Pull scheiterte daran, auch fuer die Abbilder, die er holen
          # darf. Dasselbe bei "up -d": ohne Dienstnamen startet ein Controller
          # den Audio-Stack mit.
          if grep -qF 'pull $DIENSTE' deploy/auto-update.sh; then
              echo "ok   pull laeuft nur ueber die eigenen Dienste"
          else
              echo "FEHL pull laeuft ohne Dienstliste - zieht alles, auch Fremdes"
              fehler=1
          fi
          if grep -qF 'up -d $DIENSTE' deploy/auto-update.sh; then
              echo "ok   up -d laeuft nur ueber die eigenen Dienste"
          else
              echo "FEHL up -d laeuft ohne Dienstliste - startet auch Fremdes"
              fehler=1
          fi

          # Meldet der Knoten sich unter seiner eigenen Kennung?
          #
          # Der Update-Server vergleicht die gemeldete Kennung mit der
          # Anmeldung und antwortet sonst 403. auto-update.sh schickte
          # HJ_NODE_NAME mit Rueckfall auf den Rechnernamen - auf einer
          # Hetzner-Maschine also "ubuntu-4gb-hel1-1" statt "controller-1".
          if grep -qF 'KENNUNG="$(wert HJ_KNOTEN_KENNUNG)"' deploy/auto-update.sh; then
              echo "ok   der Herzschlag nennt die Knotenkennung"
          else
              echo "FEHL auto-update.sh meldet nicht HJ_KNOTEN_KENNUNG - das gibt 403."
              fehler=1
          fi

          # Meldet sich der Knoten im laufenden Betrieb mit seiner eigenen
          # Kennung an?
          #
          # auto-update.sh benutzte "-u knoten:${HJ_TOKEN_KNOTEN}" - den
          # gemeinsamen Zugang. Der Updater weist ihn ab, seit
          # hj.token.gemeinsam-erlauben auf false steht: 401, und kein Knoten
          # zog je ein Update. Gesetzt hat den Wert ohnehin nur der alte
          # interaktive Weg.
          #
          # knoten-aufsetzen.sh ist ausgenommen: das ist der Weg VOR der
          # Anmeldung. Dort gibt es noch keine eigene Kennung, und das kurze
          # Passwort fuer /knoten/ heisst weiterhin so.
          if grep -nE '\-u "knoten:\$\{HJ_TOKEN_KNOTEN\}' \
                 deploy/auto-update.sh deploy/install-node.sh deploy/agent/*.sh 2>/dev/null; then
              echo "FEHL im laufenden Betrieb meldet sich noch jemand als 'knoten' an."
              echo "     Der gemeinsame Zugang ist abgeschaltet - das gibt 401."
              fehler=1
          else
              echo "ok   der laufende Betrieb benutzt die eigene Kennung"
          fi

          # Und liest auto-update.sh die eigene Kennung ueberhaupt aus der .env?
          #
          # Sie stand dort als Shell-Variable im Zugriff, ohne je gelesen zu
          # werden - die .env wird nicht in die Umgebung geladen. Das ":?"
          # brach dann ab mit "Knoten nicht angemeldet", obwohl er es war.
          for v in HJ_KNOTEN_KENNUNG HJ_KNOTEN_GEHEIMNIS; do
              if grep -q "${v}=\"\$(wert ${v})\"" deploy/auto-update.sh; then
                  printf 'ok   auto-update.sh liest %s\n' "$v"
              else
                  printf 'FEHL auto-update.sh liest %s nicht aus der .env\n' "$v"
                  fehler=1
              fi
          done

          exit "$fehler"

      # Baut ein Knoten noch selbst?
      #
      # Er kann es nicht: auf einem Knoten liegt kein Quellbaum. Ein
      # build-Block bricht deshalb schon beim Einlesen ab -
      #
      #   unable to prepare context: path "/opt/hoerjetzt/lavalink" not found
      #
      # - und zwar auch dann, wenn der betroffene Dienst gar nicht gestartet
      # werden sollte: Compose loest depends_on auf, bevor es irgendetwas
      # tut. Genau so ist ein Controller gescheitert, der ausdruecklich kein
      # Lavalink faehrt.
      #
      # Die Bloecke stammen aus der Zeit vor dem Update-Server. Sie sind weg,
      # und sie sollen wegbleiben.
      - name: Knoten bauen nicht selbst
        run: |
          set -uo pipefail
          fehler=0
          for f in deploy/docker/docker-compose.yml \
                   deploy/docker/docker-compose.lavalink.yml \
                   deploy/docker/docker-compose.nodes.yml; do
              [ -f "$f" ] || continue
              if treffer="$(grep -nE '^\s*build:' "$f")"; then
                  echo "FEHL $f baut noch selbst:"
                  echo "$treffer"
                  fehler=1
              else
                  echo "ok   $f"
              fi
          done

          # Und niemand darf einen Dienst erzwingen, den seine Rolle nicht hat.
          # depends_on zieht ihn sonst mit hoch.
          #
          # Kommentarzeilen zaehlen nicht - der Block oben erklaert ja gerade,
          # warum Lavalink dort NICHT mehr steht.
          treffer="$(awk '
              /^[[:space:]]*#/          { next }
              /^[[:space:]]*depends_on:/{ drin=1; next }
              drin && /^[[:space:]]*[a-z0-9_-]+:[[:space:]]*$/ && /lavalink/ {
                  printf "%d: %s\n", NR, $0 }
              drin && /^[[:space:]]*-[[:space:]]*lavalink/ {
                  printf "%d: %s\n", NR, $0 }
              /^[[:space:]]*(networks|ports|environment|volumes|image|restart):/ { drin=0 }
          ' deploy/docker/docker-compose.yml)"
          if [ -n "$treffer" ]; then
              echo "FEHL ein Dienst haengt per depends_on an Lavalink:"
              echo "$treffer"
              echo "     Audio-Knoten stehen auf eigenen Hosts - ein Startzwang"
              echo "     erreicht sie dort nicht und zieht sie hier faelschlich hoch."
              fehler=1
          else
              echo "ok   nichts haengt per depends_on an Lavalink"
          fi
          exit "$fehler"


      # Ist die Kennung des Updaters ueberall dieselbe?
      #
      # Dem Updater gehoert "release/" im Auslieferungsvolumen - er schaltet
      # dort beim Zurueckrollen "release/aktuell" um. Die Kennung dafuer steht
      # an drei Stellen: das Dockerfile legt den Benutzer an, lib.sh setzt die
      # Rechte beim Veroeffentlichen, update.sh zieht sie bei Bestands-
      # installationen nach.
      #
      # Laufen sie auseinander, faellt das nirgends auf: der Bau geht durch,
      # die Proben laufen, der Dienst startet. Erst beim Zurueckrollen kommt
      # ein "Permission denied" aus einer Schicht, in der niemand sucht - und
      # zwar genau in dem Moment, in dem man zurueckrollen will.
      - name: Kennung des Updaters
        run: |
          set -uo pipefail
          fehler=0

          docker_uid="$(grep -oE '\-\-uid [0-9]+' update-server/updater/Dockerfile \
                        | grep -oE '[0-9]+' | head -1)"
          lib_uid="$(grep -oE '^AUS_BESITZER="\$\{AUS_BESITZER:-[0-9]+\}"' \
                     update-server/lib.sh | grep -oE '[0-9]+' | head -1)"
          update_uid="$(grep -oE 'chown -R [0-9]+:[0-9]+ /v' \
                        update-server/update.sh | grep -oE '[0-9]+' | head -1)"

          for paar in "Dockerfile:$docker_uid" "lib.sh:$lib_uid" "update.sh:$update_uid"; do
              if [ -z "${paar#*:}" ]; then
                  echo "FEHL keine Kennung in ${paar%%:*} gefunden - Pruefung anpassen."
                  fehler=1
              fi
          done

          if [ "$fehler" -eq 0 ] \
             && [ "$docker_uid" = "$lib_uid" ] && [ "$lib_uid" = "$update_uid" ]; then
              echo "ok   Kennung ${docker_uid} in Dockerfile, lib.sh und update.sh"
          elif [ "$fehler" -eq 0 ]; then
              echo "FEHL Kennungen laufen auseinander:"
              echo "     Dockerfile ${docker_uid}, lib.sh ${lib_uid}, update.sh ${update_uid}"
              echo "     Zurueckrollen ueber die Oberflaeche scheitert dann an den Rechten."
              fehler=1
          fi
          exit "$fehler"


      # Sind die Vorlagen strukturell heil?
      #
      # Anlass: eine awk-Ersetzung hat knoten.html von 235 auf 36 Zeilen
      # gekuerzt - der Bereichsschalter fand sein Ende nicht und verschluckte
      # alles danach. Die Datei war danach syntaktisch unauffaellig, nur eben
      # halb. Die Seite rendert dann ohne Fehler und ist leer.
      #
      # Genau das faellt weder beim Uebersetzen noch in den Proben auf: es ist
      # kein Java, und Thymeleaf beschwert sich nicht ueber fehlende Teile.
      - name: Vorlagen strukturell pruefen
        run: |
          set -uo pipefail
          fehler=0
          cd update-server/updater/src/main/resources/templates
          for f in *.html; do
              meldung=""
              for tag in div form table main body html; do
                  auf="$(grep -o "<${tag}[ >]" "$f" | wc -l)"
                  zu="$(grep -o "</${tag}>" "$f" | wc -l)"
                  if [ "$auf" -ne "$zu" ]; then
                      meldung="${meldung} ${tag}(${auf}/${zu})"
                  fi
              done
              # grund.html ist ein Baustein und schliesst absichtlich nicht alles.
              if [ "$f" = "grund.html" ]; then
                  printf 'uebersprungen %s (Baustein)\n' "$f"
                  continue
              fi
              if [ -n "$meldung" ]; then
                  printf 'FEHL %-16s unausgeglichen:%s\n' "$f" "$meldung"
                  fehler=1
              else
                  printf 'ok   %-16s %s Zeilen\n' "$f" "$(grep -c '' "$f")"
              fi
          done
          exit "$fehler"


      # Fragt der Tresor alles ab, was der Stack zwingend braucht?
      #
      # Die Compose-Datei markiert Pflichtwerte mit ${VAR:?...}. Fehlt einer
      # im Tresor, laeuft das Aufsetzen bis zum Start durch und endet dann in
      #
      #   error while interpolating services.core.environment.HJ_WEB_BASE_URL:
      #   required variable HJ_WEB_BASE_URL is missing a value
      #
      # Die Meldung zeigt auf die Compose-Datei, obwohl dort nichts fehlt -
      # die Luecke liegt in tresor.sh, auf einer anderen Maschine. Genau so
      # ist HJ_WEB_BASE_URL durchgerutscht: nirgends abgefragt, nirgends
      # bemerkt, bis ein Knoten nicht startete.
      #
      # Beide Listen stehen im Repository. Sie gegeneinander zu halten kostet
      # nichts.
      # Wird jeder Pflichtwert irgendwo gesetzt?
      #
      # Die Compose-Datei markiert Pflichtwerte mit ${VAR:?...}. Fehlt einer,
      # laeuft das Aufsetzen bis zum Start durch und endet dann in
      #
      #   error while interpolating services.core.environment.HJ_WEB_BASE_URL:
      #   required variable HJ_WEB_BASE_URL is missing a value
      #
      # Die Meldung zeigt auf die Compose-Datei, obwohl dort nichts fehlt.
      # Genau so ist HJ_WEB_BASE_URL durchgerutscht: nirgends abgefragt,
      # nirgends bemerkt, bis ein Knoten nicht startete.
      #
      # Drei Quellen sind zulaessig, und sie haben verschiedene Aufgaben:
      #
      #   tresor.sh        Zugangsdaten, die alle Knoten eines Profils teilen
      #   install-node.sh  was der Knoten ueber sich selbst weiss
      #   auto-update.sh   was aus dem Release kommt (Registry, Marken)
      #
      # Der Rechner ist es egal, woher der Wert kommt - fehlen darf er
      # nirgends.
      - name: Wird jeder Pflichtwert gesetzt?
        run: |
          set -uo pipefail
          fehler=0
          for v in $(grep -oE '\$\{HJ_[A-Z_]+:\?' deploy/docker/docker-compose.yml \
                     | sed 's/\${//;s/:?//' | sort -u); do
              quelle=""
              grep -q "^${v}=\${${v}}" update-server/tresor.sh && quelle="tresor.sh"
              grep -q "umgebung_setzen ${v}" deploy/install-node.sh && quelle="${quelle:+$quelle, }install-node.sh"
              grep -qE "printf '${v}=%s" deploy/auto-update.sh && quelle="${quelle:+$quelle, }auto-update.sh"
              if [ -n "$quelle" ]; then
                  printf 'ok    %-26s %s\n' "$v" "$quelle"
              else
                  printf 'FEHL  %-26s wird nirgends gesetzt\n' "$v"
                  fehler=1
              fi
          done
          if [ "$fehler" -ne 0 ]; then
              echo
              echo "Ein Knoten mit diesem Stand startet nicht - er bekommt den Wert nie."
          fi
          exit "$fehler"

  compose:
    name: Compose-Dateien pruefen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # "config" liest die Datei so, wie Docker sie spaeter liest. Ein
      # Einrueckungsfehler oder eine unaufloesbare Variable faellt hier auf
      # und nicht beim Hochfahren auf dem Zielsystem.
      #
      # Die Pflichtwerte werden nur gesetzt, damit die Pruefung durchlaeuft -
      # es sind keine Zugangsdaten und sie landen nirgends.
      - name: docker compose config
        run: |
          set -euo pipefail
          cd deploy/docker
          cat > .env <<'ENV'
          HJ_BOT_TOKEN=pruefung
          HJ_DB_PASSWORD=pruefung
          HJ_LAVALINK_PASSWORD=pruefung
          HJ_WEB_BASE_URL=https://beispiel.invalid
          HJ_DISCORD_CLIENT_ID=0
          HJ_DISCORD_CLIENT_SECRET=pruefung
          HJ_REGISTRY=beispiel.invalid/hoerjetzt
          ENV
          # Beide Dateien, wie im Betrieb. Ohne die Spock-Ueberlagerung legt
          # Compose Postgres aus der Grunddatei an - auf einem leeren Volume.
          # Das ist hier folgenlos, aber die Pruefung soll denselben Aufruf
          # nehmen wie der Betrieb.
          docker compose -f docker-compose.yml -f docker-compose.spock.yml config >/dev/null
          echo "Hauptstack ok."
          docker compose -f docker-compose.nodes.yml config >/dev/null 2>&1 \
            || echo "Hinweis: docker-compose.nodes.yml braucht ein vorhandenes Netz - uebersprungen."
          rm -f .env

      - name: Update-Server-Compose
        run: |
          set -euo pipefail
          cd update-server
          cat > .env <<'ENV'
          HJ_TOKEN_KNOTEN=pruefung
          HJ_TOKEN_AUFSETZEN=pruefung
          HJ_VERWALTER_HASH=pruefung
          HJ_UPDATE_HOST=beispiel.invalid
          ENV
          docker compose config >/dev/null
          echo "Update-Server ok."
          rm -f .env
